<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RenoWise — плани для дому</title>
  <meta name="description" content="RenoWise: ремонт, техніка й дрібниці для дому — варіанти, бюджет, де купувати, креслення квартири. Працює офлайн, мешканці бачать зміни одне одного.">
  <meta name="theme-color" content="#070a13">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RenoWise">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Тема до першого малювання — без «спалаху» -->
  <script>
    try {
      var t = (JSON.parse(localStorage.getItem('reno.prefs') || '{}').theme) || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-in">
      <span class="brand-mark">
        <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path class="bm-roof" pathLength="1" d="M9.5 24.5L22 13l12.5 11.5"/>
          <path class="bm-body" pathLength="1" d="M13.5 22.5V35h17V22.5"/>
          <path class="bm-door" pathLength="1" d="M19.5 35v-7h5v7"/>
          <path class="bm-spark" d="M37 6.5l1.4 3.8 3.8 1.4-3.8 1.4L37 17l-1.4-3.9-3.8-1.4 3.8-1.4z" fill="#fff" stroke="none"/>
        </svg>
      </span>
      <span class="brand-name"><span class="b-reno">Reno</span><span class="b-wise">Wise</span><i class="brand-ruler"></i></span>
      <span class="splash-sub">дім, який ви плануєте</span>
    </div>
  </div>
  <div id="app"></div>

  <input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-gal" accept="image/*" hidden>
  <input type="file" id="file-import" accept="application/json,.json" hidden>

  <noscript>RenoWise потребує JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
